# .claude/skills/ holds upstream's copies, which this repo doesn't edit. The leak check reads the
# staged files itself, so it still covers them.
exclude: ^\.claude/skills/
repos:
  - repo: local
    hooks:
      - id: kaizen-leak-check
        name: kaizen leak check
        entry: kaizen hook leak-check
        language: system
        pass_filenames: false
      - id: kaizen-no-commit-to-branch
        name: kaizen no commit to branch
        entry: kaizen hook no-commit-to-branch
        language: system
        pass_filenames: false
        always_run: true
      - id: kaizen-prose-marks
        name: kaizen prose marks
        entry: kaizen hook prose-marks
        language: system
      - id: kaizen-section-banners
        name: kaizen section banners
        entry: kaizen hook section-banners
        language: system
      - id: kaizen-work-tracking
        name: kaizen work-tracking references
        entry: kaizen hook work-tracking
        language: system
      # The hooks kaizen added after its last release run from kaizen's own build, so this repo
      # checks itself with them before the installed kaizen has them.
      - id: kaizen-doc-paths
        name: kaizen doc paths
        entry: uv run --project kaizen kaizen hook doc-paths
        language: system
        pass_filenames: false
        always_run: true
        # The first study makes docs/research/, and the first root-level decision docs/adr/.
        args: [--allow, docs/research/, --allow, docs/adr/]
      - id: kaizen-glossary-terms
        name: kaizen glossary terms
        entry: uv run --project kaizen kaizen hook glossary-terms
        language: system
      - id: kaizen-test-names
        name: kaizen test names
        entry: uv run --project kaizen kaizen hook test-names
        language: system
      # kaizen's own ruff, from kaizen/uv.lock, so the hook and kaizen/scripts/check.sh use one version
      # and config.
      - id: ruff-check
        name: ruff check (kaizen)
        entry: uv run --project kaizen ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^kaizen/
      - id: ruff-format
        name: ruff format (kaizen)
        entry: uv run --project kaizen ruff format
        language: system
        types_or: [python, pyi]
        files: ^kaizen/
