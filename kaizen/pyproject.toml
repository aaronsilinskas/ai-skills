[project]
name = "kaizen-kit"
dynamic = ["version"]
description = "The deterministic parts of agent workflows: tickets, specs, the leak check and synced files for every project a home registers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kaizen = "kaizen.shared.cli:main"
kz = "kaizen.shared.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

# The version comes from the latest kaizen-v* tag: a tagged commit builds as X.Y.Z, and any other
# as a dev version past it, such as 0.1.1.dev3+g<sha>. The repo root is the VCS root, since the
# package sits in kaizen/.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", tag_regex = '^kaizen-v(?P<version>\d+\.\d+\.\d+)$', git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "kaizen-v*",
] }

[tool.hatch.build.targets.wheel]
packages = ["src/kaizen"]
# The tests sit inside the package for the import contracts; the wheel ships without them.
exclude = ["src/kaizen/tests"]

# The sdist holds only what a build needs, not the caches the check leaves in kaizen/.
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml"]

# The LICENSE sits at the repo root, outside kaizen/, so the sdist copies it in, where the wheel
# built from that sdist finds it by hatchling's default license-files patterns.
[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"

# Reinstall the editable package when the commit or tags change, so its version stays current.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    # Pinned exactly, so a new mypy release never changes what the check reports.
    "mypy==2.4.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # pep8-naming conventions
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (cleaner list/dict/set expressions)
    "SIM", # flake8-simplify (redundant code patterns)
    "RUF", # ruff-native rules
]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Test functions and fixtures need no annotations; their bodies stay checked.
[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false

# lint-imports keeps the layers acyclic: kaizen's shared code sits below every command group,
# and spec sits below ticket.
[tool.importlinter]
root_package = "kaizen"

[[tool.importlinter.contracts]]
name = "kaizen's shared code imports none of the command groups"
type = "forbidden"
source_modules = ["kaizen.shared"]
forbidden_modules = [
    "kaizen.ticket",
    "kaizen.spec",
    "kaizen.project",
    "kaizen.pr",
    "kaizen.issue",
    "kaizen.home",
    "kaizen.hook",
]
ignore_imports = [
    # The CLI is the entry point: it registers every group's commands.
    "kaizen.shared.cli -> kaizen.ticket.*",
    "kaizen.shared.cli -> kaizen.spec.*",
    "kaizen.shared.cli -> kaizen.project.*",
    "kaizen.shared.cli -> kaizen.pr.*",
    "kaizen.shared.cli -> kaizen.issue.*",
    "kaizen.shared.cli -> kaizen.home.*",
    "kaizen.shared.cli -> kaizen.hook.*",
]

[[tool.importlinter.contracts]]
name = "spec does not import ticket"
type = "forbidden"
source_modules = ["kaizen.spec"]
forbidden_modules = ["kaizen.ticket"]

[[tool.importlinter.contracts]]
name = "the registry does not import the ticket worktree"
type = "forbidden"
source_modules = ["kaizen.shared.registry"]
forbidden_modules = ["kaizen.shared.ticket_worktree"]
