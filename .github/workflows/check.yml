name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Check command
        # The full leak check needs a home's facts, which no runner has, so it runs on the
        # contributor's machine. The check command's home leak scan needs none: it refuses
        # home-directory paths in the lines the PR adds since origin's default branch, which
        # fetch-depth 0 fetches.
        run: bash scripts/check.sh
